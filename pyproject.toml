[project]
name = "crossfoot"
version = "0.0.1"
description = "Arithmetic-reconciled corpus of public statistical tables"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.18"]

[dependency-groups]
dev = ["pytest>=8"]

# script-style repo: reconcile.py at the root, no wheel to build
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
